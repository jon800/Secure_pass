    <script>
        // ========== CONFIGURATION ========== 
        // TODO: Add your Google OAuth Client ID from Google Cloud Console.
        // This client ID must have the Google Drive API enabled and its OAuth
        // consent screen must authorize the 'drive.appdata' scope below, or
        // the Drive backup/restore calls will fail with a consent error.
        const GOOGLE_CLIENT_ID = '922495437526-vncfuahnsl7pf232upv2kkcu76pqr6b9.apps.googleusercontent.com';
        const GOOGLE_DRIVE_SCOPE = 'https://www.googleapis.com/auth/drive.appdata';
        const DRIVE_BACKUP_FILENAME = 'securevault-backup.json';

        // GIS OAuth2 token client used to obtain a Drive-scoped access token,
        // separate from the ID-token sign-in button used for identity.
        let driveTokenClient = null;
        let cachedDriveAccessToken = null;

        // ========== CRYPTO UTILITIES ==========
        /**
         * @typedef {{ iv: string, data: string }} EncryptedPayload
         */
        const CryptoUtils = {
            /**
             * Generate a cryptographically random salt.
             * @param {number} [length=32]
             * @returns {Uint8Array}
             */
            generateSalt: (length = 32) => {
                return window.crypto.getRandomValues(new Uint8Array(length));
            },

            /**
             * Derive an AES-GCM key from a password using PBKDF2.
             * @param {string} password
             * @param {Uint8Array} salt
             * @param {number} [iterations=100000]
             * @returns {Promise<CryptoKey>}
             */
            deriveKey: async (password, salt, iterations = 100000) => {
                const encoder = new TextEncoder();
                const data = encoder.encode(password);
                const baseKey = await window.crypto.subtle.importKey('raw', data, 'PBKDF2', false, ['deriveBits']);
                const bits = await window.crypto.subtle.deriveBits('PBKDF2', baseKey, 256, {
                    name: 'PBKDF2',
                    salt: salt,
                    iterations: iterations,
                    hash: 'SHA-256'
                });
                return await window.crypto.subtle.importKey('raw', bits, 'AES-GCM', false, ['encrypt', 'decrypt']);
            },

            /**
             * Encrypt arbitrary JSON-serializable data with AES-GCM.
             * @param {*} data
             * @param {CryptoKey} key
             * @returns {Promise<EncryptedPayload>}
             */
            encrypt: async (data, key) => {
                const iv = window.crypto.getRandomValues(new Uint8Array(12));
                const encoder = new TextEncoder();
                const encoded = encoder.encode(JSON.stringify(data));
                // The IV must be passed as part of the algorithm params, or AES-GCM
                // will throw (a bare algorithm name string is not a valid parameter).
                const encrypted = await window.crypto.subtle.encrypt({ name: 'AES-GCM', iv: iv }, key, encoded);
                return {
                    iv: CryptoUtils.arrayToBase64(iv),
                    data: CryptoUtils.arrayToBase64(new Uint8Array(encrypted))
                };
            },

            /**
             * Decrypt a payload produced by {@link CryptoUtils.encrypt}.
             * @param {EncryptedPayload} encryptedData
             * @param {CryptoKey} key
             * @returns {Promise<*>}
             */
            decrypt: async (encryptedData, key) => {
                const iv = CryptoUtils.base64ToArray(encryptedData.iv);
                const encrypted = CryptoUtils.base64ToArray(encryptedData.data);
                // Must supply the same IV used at encryption time, or decryption
                // will silently produce garbage / throw an authentication error.
                const decrypted = await window.crypto.subtle.decrypt({ name: 'AES-GCM', iv: iv }, key, encrypted);
                const decoder = new TextDecoder();
                return JSON.parse(decoder.decode(decrypted));
            },

            /**
             * @param {Uint8Array} arr
             * @returns {string}
             */
            arrayToBase64: (arr) => {
                return btoa(String.fromCharCode.apply(null, arr));
            },

            /**
             * @param {string} str
             * @returns {Uint8Array}
             */
            base64ToArray: (str) => {
                return new Uint8Array(atob(str).split('').map(c => c.charCodeAt(0)));
            }
        };

        // ========== APP CLASS ==========
        class SecureVault {
            constructor() {
                this.db = null;
                this.key = null;
                this.salt = null;
                this.isLocked = false;
                this.currentUser = null;
                this.currentFilter = 'all';
                this.editingId = null;
                this.autoLockTimer = null;
                this.autoLockTimeout = 5 * 60 * 1000; // 5 minutes
                this.init();
            }

            async init() {
                await this.initDB();
                this.setupGoogleSignIn();
                this.initDriveTokenClient();

                const isLoggedIn = await this.checkLoginStatus();
                if (!isLoggedIn) {
                    this.showAuthScreen();
                    this.showAuthStep('google');
                    return;
                }

                this.showAppScreen();
            
            

            // ========== DATABASE ==========
            async initDB() {
                return new Promise((resolve, reject) => {
                    const request = indexedDB.open('SecureVault', 1);

                    request.onerror = () => reject(request.error);
                    request.onsuccess = () => {
                        this.db = request.result;
                        resolve();
                    };

                    request.onupgradeneeded = (event) => {
                        const db = event.target.result;
                        if (!db.objectStoreNames.contains('vault')) {
                            db.createObjectStore('vault', { keyPath: 'id' });
                        }
                        if (!db.objectStoreNames.contains('settings')) {
                            db.createObjectStore('settings', { keyPath: 'key' });
                        }
                    };
                });
            }

            // ========== AUTH ==========
            setupGoogleSignIn() {
                if (window.google) {
                    google.accounts.id.initialize({
                        client_id: GOOGLE_CLIENT_ID,
                        callback: (response) => this.handleGoogleSignIn(response)
                    });
                    google.accounts.id.renderButton(
                        document.getElementById('googleSignInContainer'),
                        { theme: 'dark', size: 'large', width: '100%' }
                    );
                }
            }

            /**
             * Initialize the OAuth2 token client used to obtain a
             * Drive-scoped access token (separate from the ID-token sign-in
             * button above, which only proves identity).
             */
            initDriveTokenClient() {
                if (window.google && google.accounts && google.accounts.oauth2) {
                    driveTokenClient = google.accounts.oauth2.initTokenClient({
                        client_id: GOOGLE_CLIENT_ID,
                        scope: GOOGLE_DRIVE_SCOPE,
                        callback: () => {} // overridden per-request in getGoogleAccessToken()
                    });
                }
            }

            /**
             * Request (or reuse a cached) OAuth access token with Drive
             * appdata scope. Resolves with the token, or rejects if the
             * token client isn't available or the user declines consent.
             * @returns {Promise<string>}
             */
            getGoogleAccessToken() {
                return new Promise((resolve, reject) => {
                    if (!driveTokenClient) {
                        reject(new Error('Google Drive access is not available'));
                        return;
                    }
                    driveTokenClient.callback = (tokenResponse) => {
                        if (tokenResponse.error) {
                            reject(new Error(tokenResponse.error));
                            return;
                        }
                        cachedDriveAccessToken = tokenResponse.access_token;
                        resolve(tokenResponse.access_token);
                    };
                    driveTokenClient.requestAccessToken({ prompt: cachedDriveAccessToken ? '' : 'consent' });
                });
            }

            /**
             * @param {{ credential: string }} response
             * @returns {Promise<void>}
             */
            async handleGoogleSignIn(response) {
                try {
                    // Decode JWT (in real app, verify on backend)
                    const base64Url = response.credential.split('.')[1];
                    const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
                    const jsonPayload = decodeURIComponent(atob(base64).split('').map((c) => {
                        return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
                    }).join(''));
                    
                    const user = JSON.parse(jsonPayload);
                    this.currentUser = {
                        id: user.sub,
                        name: user.name,
                        email: user.email,
                        picture: user.picture,
                        loginMethod: 'google'
                    };

                    await this.saveUserData();
                    this.showAlert('Welcome ' + user.name + '!', 'success');

                    // Pull down any existing encrypted vault + salt from
                    // Drive before deciding whether this device needs a new
                    // app lock password or can unlock with an existing one.
                    // Silent: a brand-new account has no backup yet, and
                    // that isn't an error worth surfacing here.
                    await this.restoreFromCloud({ silent: true });

                    const hasAppLock = await this.hasAppLockConfigured();
                    this.showAuthScreen();
                    if (hasAppLock) {
                        this.isLocked = true;
                        this.showAuthStep('unlock');
                    } else {
                        this.showAuthStep('setup');
                    }
                } catch (error) {
                    this.showAlert('Google Sign-In failed: ' + error.message, 'danger');
                }
            }

            /**
             * Create this device's app lock password. Derives the vault's
             * AES-GCM encryption key from it via PBKDF2 (same as before),
             * but this password is purely a local app-lock gate - it is not
             * an alternate login method, Google sign-in is required first.
             * @returns {Promise<void>}
             */
            async setupAppLockPassword() {
                const pwd = document.getElementById('appLockPassword').value;
                const pwd2 = document.getElementById('appLockPasswordConfirm').value;

                if (!pwd || pwd.trim().length < 8) {
                    this.showAlert('App lock password must be at least 8 characters', 'warning');
                    return;
                }

                if (!/[A-Za-z]/.test(pwd) || !/[0-9]/.test(pwd)) {
                    this.showAlert('App lock password must contain both letters and numbers', 'warning');
                    return;
                }

                if (pwd !== pwd2) {
                    this.showAlert('Passwords do not match', 'danger');
                    return;
                }

                this.salt = CryptoUtils.generateSalt();
                this.key = await CryptoUtils.deriveKey(pwd, this.salt);

                await this.saveToLocalStorage('applock', { salt: CryptoUtils.arrayToBase64(this.salt) });

                // Store a small encrypted marker so future unlock attempts
                // can verify a candidate password actually derives the
                // right key, instead of silently accepting anything.
                const testPayload = await CryptoUtils.encrypt({ check: 'securevault' }, this.key);
                await this.saveToLocalStorage('test_data', testPayload);

                document.getElementById('appLockPassword').value = '';
                document.getElementById('appLockPasswordConfirm').value = '';

                this.isLocked = false;
                this.showAppScreen();
                this.showAlert('App lock password set. Your vault is now protected.', 'success');

                // Back this device's salt up right away so a second device
                // can restore it and unlock with the same password.
                this.syncToCloud();
            }

            /**
             * @returns {Promise<boolean>} true if a 'user' record (a signed-in Google identity) exists
             */
            async checkLoginStatus() {
                const user = await this.getSetting('user');
                if (!user) {
                    return false;
                }
                this.currentUser = user;
                return true;
            }

            /**
             * Read a single value from the 'settings' object store.
             * @param {string} key
             * @returns {Promise<*>} the stored value, or null if the key doesn't exist
             */
            async getSetting(key) {
                return new Promise((resolve, reject) => {
                    const request = this.db.transaction('settings').objectStore('settings').get(key);
                    request.onsuccess = () => resolve(request.result ? request.result.value : null);
                    request.onerror = () => reject(request.error);
                });
            }

            /**
             * @returns {Promise<boolean>} true if this device already has an app lock password configured
             */
            async hasAppLockConfigured() {
                const applock = await this.getSetting('applock');
                return !!applock;
            }

            /**
             * @returns {Promise<void>}
             */
            async saveUserData() {
                return this.saveToLocalStorage('user', this.currentUser);
            }

            logout() {
                if (confirm('Are you sure you want to logout?')) {
                    this.key = null;
                    this.currentUser = null;
                    this.isLocked = false;
                    cachedDriveAccessToken = null;
                    if (window.google && google.accounts && google.accounts.id) {
                        google.accounts.id.disableAutoSelect();
                    }
                    // Clear IndexedDB
                    const req = indexedDB.deleteDatabase('SecureVault');
                    req.onsuccess = () => {
                        location.reload();
                    };
                }
            }

            // ========== LOCK/UNLOCK ==========
            /**
             * Manually lock the app. Drops the derived key from memory and
             * swaps the whole app screen out for the unlock step - this is a
             * real full-app lock, not just a UI flag.
             * @param {string} [reason]
             */
            toggleLock(reason) {
                if (!this.isLocked) {
                    this.lock(reason);
                }
            }

            /**
             * @param {string} [reason] optional message shown on the unlock screen
             */
            lock(reason) {
                this.isLocked = true;
                this.key = null;
                this.showAuthScreen();
                this.showAuthStep('unlock', reason);
            }

            /**
             * Read the password from the unlock step's input and attempt to
             * unlock with it.
             * @returns {Promise<void>}
             */
            async unlockWithPasswordInput() {
                const input = document.getElementById('appUnlockPassword');
                const pwd = input.value;
                if (!pwd) return;
                input.value = '';
                await this.unlockWithPassword(pwd);
            }

            /**
             * @param {string} password
             * @returns {Promise<void>}
             */
            async unlockWithPassword(password) {
                try {
                    if (!this.salt) {
                        const applock = await this.getSetting('applock');
                        if (!applock) {
                            this.showAlert('App lock is not set up on this device yet', 'danger');
                            return;
                        }
                        this.salt = CryptoUtils.base64ToArray(applock.salt);
                    }

                    const derivedKey = await CryptoUtils.deriveKey(password, this.salt);
                    // Test the derived key against the stored marker before
                    // trusting it, instead of accepting any password.
                    const testData = await this.getSetting('test_data');
                    if (testData) {
                        try {
                            await CryptoUtils.decrypt(testData, derivedKey);
                        } catch {
                            this.showAlert('Incorrect app lock password', 'danger');
                            return;
                        }
                    }

                    this.key = derivedKey;
                    this.isLocked = false;
                    this.showAppScreen();
                    this.showAlert('Vault unlocked', 'success');
                    this.resetAutoLock();
                } catch (error) {
                    this.showAlert('Failed to unlock vault: ' + error.message, 'danger');
                }
            }

            resetAutoLock() {
                clearTimeout(this.autoLockTimer);
                this.autoLockTimer = setTimeout(() => {
                    this.lock('Locked automatically due to inactivity.');
                }, this.autoLockTimeout);
            }

            // ========== PASSWORD OPERATIONS ==========
            async getVaultEntries() {
                return new Promise((resolve) => {
                    const request = this.db.transaction('vault').objectStore('vault').getAll();
                    request.onsuccess = () => {
                        resolve(request.result);
                    };
                });
            }

            async savePassword() {
                if (this.isLocked) {
                    this.showAlert('Vault is locked', 'warning');
                    return;
                }

                const title = document.getElementById('formTitle').value;
                const category = document.getElementById('formCategory').value;
                const website = document.getElementById('formWebsite').value;
                const username = document.getElementById('formUsername').value;
                const password = document.getElementById('formPassword').value;
                const notes = document.getElementById('formNotes').value;

                if (!title || !password) {
                    this.showAlert('Please fill in required fields', 'warning');
                    return;
                }

                const entry = {
                    id: this.editingId || Date.now().toString(),
                    title,
                    category,
                    website,
                    username,
                    password,
                    notes,
                    createdAt: new Date().toISOString(),
                    updatedAt: new Date().toISOString()
                };

                try {
                    // Encrypt the entry
                    const encrypted = await CryptoUtils.encrypt(entry, this.key);

                    return new Promise((resolve) => {
                        const tx = this.db.transaction('vault', 'readwrite');
                        const store = tx.objectStore('vault');
                        store.put({
                            id: entry.id,
                            encrypted: encrypted
                        });
                        tx.oncomplete = () => {
                            this.showAlert(this.editingId ? 'Password updated!' : 'Password saved!', 'success');
                            this.closeModal('addModal');
                            this.closeModal('editModal');
                            this.editingId = null;
                            this.loadPasswords();
                            this.syncToCloud();
                            resolve();
                        };
                    });
                } catch (error) {
                    this.showAlert('Failed to save password: ' + error.message, 'danger');
                }
            }

            async loadPasswords() {
                const entries = await this.getVaultEntries();
                const decrypted = [];

                for (const entry of entries) {
                    try {
                        const data = await CryptoUtils.decrypt(entry.encrypted, this.key);
                        decrypted.push(data);
                    } catch (error) {
                        console.error('Failed to decrypt entry:', error);
                    }
                }

                this.renderPasswords(decrypted);
                this.updateSecurityScore(decrypted);
            }

            /**
             * @param {Array<Object>} entries
             */
            renderPasswords(entries) {
                const container = document.getElementById('cardsContainer');
                let filtered = entries;

                // Apply filters
                if (this.currentFilter !== 'all') {
                    filtered = entries.filter(e => e.category === this.currentFilter);
                }

                // Apply search
                const searchTerm = document.getElementById('searchInput').value.toLowerCase();
                if (searchTerm) {
                    filtered = filtered.filter(e =>
                        e.title.toLowerCase().includes(searchTerm) ||
                        e.username.toLowerCase().includes(searchTerm) ||
                        e.website.toLowerCase().includes(searchTerm)
                    );
                }

                if (filtered.length === 0) {
                    container.innerHTML = `
                        <div style="grid-column: 1 / -1;">
                            <div class="empty-state">
                                <div class="empty-icon">🔒</div>
                                <h3 style="color: var(--text-primary); margin-bottom: 10px;">No passwords found</h3>
                                <p>Start by adding your first password entry</p>
                                <button style="margin-top: 20px;" onclick="app.showAddModal()">➕ Add Password</button>
                            </div>
                        </div>
                    `;
                    return;
                }

                container.innerHTML = filtered.map(entry => `
                    <div class="password-card">
                        <div class="card-header">
                            <div>
                                <div class="card-title">${this.escapeHtml(entry.title)}</div>
                                <span class="card-category">${entry.category}</span>
                            </div>
                            <div class="card-actions">
                                <button class="btn-secondary btn-small btn-icon" onclick="app.editPassword('${entry.id}')" title="Edit">✏️</button>
                                <button class="btn-danger btn-small btn-icon" onclick="app.deletePassword('${entry.id}')" title="Delete">🗑️</button>
                            </div>
                        </div>

                        ${entry.website ? `
                            <div class="card-field">
                                <span class="card-field-label">Website</span>
                                <div class="card-field-value">
                                    <a href="${entry.website}" target="_blank" style="color: var(--primary-light); text-decoration: none; flex: 1; overflow: hidden; text-overflow: ellipsis;">
                                        ${this.escapeHtml(entry.website.replace(/https?:\/\//, ''))}
                                    </a>
                                    <button class="copy-btn" onclick="app.copyToClipboard('${this.escapeHtml(entry.website)}')">📋</button>
                                </div>
                            </div>
                        ` : ''}

                        ${entry.username ? `
                            <div class="card-field">
                                <span class="card-field-label">Username/Email</span>
                                <div class="card-field-value">
                                    <span style="flex: 1; overflow: hidden; text-overflow: ellipsis;">${this.escapeHtml(entry.username)}</span>
                                    <button class="copy-btn" onclick="app.copyToClipboard('${this.escapeHtml(entry.username)}')">📋</button>
                                </div>
                            </div>
                        ` : ''}

                        <div class="card-field">
                            <span class="card-field-label">Password</span>
                            <div class="card-field-value">
                                <span style="flex: 1;">••••••••</span>
                                <button class="copy-btn" onclick="app.copyToClipboard('${this.escapeHtml(entry.password)}')">📋</button>
                            </div>
                            ${this.getPasswordStrength(entry.password)}
                        </div>

                        ${entry.notes ? `
                            <div class="card-field">
                                <span class="card-field-label">Notes</span>
                                <div style="font-size: 13px; color: var(--text-secondary); padding: 8px 12px; background: rgba(0, 0, 0, 0.3); border-radius: 6px;">
                                    ${this.escapeHtml(entry.notes)}
                                </div>
                            </div>
                        ` : ''}
                    </div>
                `).join('');
            }

            /**
             * @param {string|number} id
             */
            editPassword(id) {
                if (this.isLocked) {
                    this.showAlert('Vault is locked', 'warning');
                    return;
                }

                this.editingId = id;
                this.getVaultEntries().then(entries => {
                    entries.forEach(entry => {
                        if (entry.id === id) {
                            CryptoUtils.decrypt(entry.encrypted, this.key).then(data => {
                                document.getElementById('editTitle').value = data.title;
                                document.getElementById('editCategory').value = data.category;
                                document.getElementById('editWebsite').value = data.website;
                                document.getElementById('editUsername').value = data.username;
                                document.getElementById('editPassword').value = data.password;
                                document.getElementById('editNotes').value = data.notes;
                                this.openModal('editModal');
                            });
                        }
                    });
                });
            }

            async updatePassword() {
                const title = document.getElementById('editTitle').value;
                const category = document.getElementById('editCategory').value;
                const website = document.getElementById('editWebsite').value;
                const username = document.getElementById('editUsername').value;
                const password = document.getElementById('editPassword').value;
                const notes = document.getElementById('editNotes').value;

                if (!title || !password) {
                    this.showAlert('Please fill in required fields', 'warning');
                    return;
                }

                // Temporarily override the form values to use savePassword
                document.getElementById('formTitle').value = title;
                document.getElementById('formCategory').value = category;
                document.getElementById('formWebsite').value = website;
                document.getElementById('formUsername').value = username;
                document.getElementById('formPassword').value = password;
                document.getElementById('formNotes').value = notes;

                await this.savePassword();
            }

            /**
             * @param {string|number|null} [id=null]
             */
            deletePassword(id = null) {
                if (this.isLocked) {
                    this.showAlert('Vault is locked', 'warning');
                    return;
                }

                const targetId = id || this.editingId;
                if (!targetId) return;

                if (!confirm('Are you sure you want to delete this password? This action cannot be undone.')) {
                    return;
                }

                const tx = this.db.transaction('vault', 'readwrite');
                const store = tx.objectStore('vault');
                store.delete(targetId);

                tx.oncomplete = () => {
                    this.showAlert('Password deleted', 'success');
                    this.closeModal('editModal');
                    this.editingId = null;
                    this.loadPasswords();
                    this.syncToCloud();
                };
            }

            // ========== PASSWORD GENERATOR ==========
            generatePassword() {
                const uppercase = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
                const lowercase = 'abcdefghijklmnopqrstuvwxyz';
                const numbers = '0123456789';
                const symbols = '!@#$%^&*()_+-=[]{}|;:,.<>?';

                let chars = lowercase;
                if (document.getElementById('genUppercase').checked) chars += uppercase;
                if (document.getElementById('genNumbers').checked) chars += numbers;
                if (document.getElementById('genSymbols').checked) chars += symbols;

                const length = parseInt(document.getElementById('genLength').value);
                let password = '';

                for (let i = 0; i < length; i++) {
                    password += chars.charAt(Math.floor(Math.random() * chars.length));
                }

                document.getElementById('formPassword').value = password;
            }

            // ========== SECURITY & AUDIT ==========
            /**
             * @param {string} password
             * @returns {{ label: string, className: string }}
             */
            getPasswordStrength(password) {
                let strength = 0;
                if (password.length >= 8) strength++;
                if (password.length >= 12) strength++;
                if (/[a-z]/.test(password) && /[A-Z]/.test(password)) strength++;
                if (/\d/.test(password)) strength++;
                if (/[!@#$%^&*()_+\-=\[\]{}|;:,.<>?]/.test(password)) strength++;

                const levels = ['weak', 'fair', 'good', 'strong', 'very-strong'];
                const level = levels[strength] || 'weak';
                const colors = {
                    'weak': 'strength-weak',
                    'fair': 'strength-fair',
                    'good': 'strength-good',
                    'strong': 'strength-strong',
                    'very-strong': 'strength-strong'
                };

                return `<div class="strength-indicator ${colors[level]}"></div>`;
            }

            /**
             * @param {Array<Object>} entries
             */
            updateSecurityScore(entries) {
                if (entries.length === 0) {
                    document.getElementById('securityScore').textContent = '0%';
                    document.getElementById('securityLabel').textContent = 'No passwords yet';
                    return;
                }

                let strongPasswords = 0;
                let duplicates = new Set();

                entries.forEach(entry => {
                    if (this.getPasswordStrengthScore(entry.password) >= 3) {
                        strongPasswords++;
                    }
                });

                const score = Math.round((strongPasswords / entries.length) * 100);
                document.getElementById('securityScore').textContent = score + '%';
                document.getElementById('securityLabel').textContent = score >= 70 ? 'Excellent' : score >= 50 ? 'Good' : 'Needs improvement';
            }

            /**
             * @param {string} password
             * @returns {number}
             */
            getPasswordStrengthScore(password) {
                let strength = 0;
                if (password.length >= 8) strength++;
                if (password.length >= 12) strength++;
                if (/[a-z]/.test(password) && /[A-Z]/.test(password)) strength++;
                if (/\d/.test(password)) strength++;
                if (/[!@#$%^&*()_+\-=\[\]{}|;:,.<>?]/.test(password)) strength++;
                return strength;
            }

            showSecurityAudit() {
                this.getVaultEntries().then(async entries => {
                    const decrypted = [];
                    for (const entry of entries) {
                        try {
                            const data = await CryptoUtils.decrypt(entry.encrypted, this.key);
                            decrypted.push(data);
                        } catch (error) {
                            console.error('Failed to decrypt entry:', error);
                        }
                    }

                    let weakPasswords = [];
                    let duplicates = {};

                    decrypted.forEach(entry => {
                        if (this.getPasswordStrengthScore(entry.password) < 3) {
                            weakPasswords.push(entry);
                        }

                        if (!duplicates[entry.password]) {
                            duplicates[entry.password] = [];
                        }
                        duplicates[entry.password].push(entry.title);
                    });

                    let html = '<div>';
                    
                    if (weakPasswords.length > 0) {
                        html += `
                            <div class="alert alert-warning">
                                <span>⚠️ ${weakPasswords.length} weak password(s) detected</span>
                            </div>
                            ${weakPasswords.map(p => `
                                <div style="padding: 12px; background: rgba(245, 158, 11, 0.05); border-left: 3px solid var(--warning); margin-bottom: 10px;">
                                    <strong>${this.escapeHtml(p.title)}</strong><br>
                                    <small style="color: var(--text-secondary);">Consider using a stronger password</small>
                                </div>
                            `).join('')}
                        `;
                    }

                    const duplicateCount = Object.keys(duplicates).filter(key => duplicates[key].length > 1).length;
                    if (duplicateCount > 0) {
                        html += `
                            <div class="alert alert-warning" style="margin-top: 15px;">
                                <span>⚠️ ${duplicateCount} duplicate password(s) found</span>
                            </div>
                        `;
                    }

                    if (weakPasswords.length === 0 && duplicateCount === 0) {
                        html += `
                            <div class="alert alert-success">
                                <span>✓ All passwords look secure!</span>
                            </div>
                        `;
                    }

                    html += '</div>';
                    document.getElementById('auditContent').innerHTML = html;
                    this.openModal('securityAuditModal');
                });
            }

            // ========== SEARCH & FILTER ==========
            search() {
                this.loadPasswords();
            }

            /**
             * @param {string} category
             */
            filterByCategory(category) {
                this.currentFilter = category;
                document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
                event.target.classList.add('active');
                this.loadPasswords();
            }

            // ========== CLIPBOARD ==========
            /**
             * @param {string} text
             * @returns {Promise<void>}
             */
            async copyToClipboard(text) {
                try {
                    await navigator.clipboard.writeText(text);
                    this.showAlert('Copied to clipboard!', 'success');

                    // Clear clipboard after 30 seconds
                    setTimeout(() => {
                        navigator.clipboard.writeText('');
                    }, 30000);
                } catch (error) {
                    this.showAlert('Failed to copy: ' + error.message, 'danger');
                }
            }

            // ========== CLOUD SYNC (Google Drive appDataFolder) ==========
            /**
             * Find the backup file's Drive file ID in the app's hidden
             * appDataFolder, if one already exists.
             * @param {string} accessToken
             * @returns {Promise<string|null>}
             */
            async findDriveBackupFileId(accessToken) {
                const query = `name='${DRIVE_BACKUP_FILENAME}'`;
                const url = 'https://www.googleapis.com/drive/v3/files' +
                    '?spaces=appDataFolder&fields=files(id,name)&q=' + encodeURIComponent(query);
                const res = await fetch(url, { headers: { Authorization: `Bearer ${accessToken}` } });
                if (!res.ok) {
                    throw new Error('Google Drive lookup failed (' + res.status + ')');
                }
                const data = await res.json();
                return data.files && data.files.length ? data.files[0].id : null;
            }

            /**
             * Create or update the encrypted backup file in Drive's
             * appDataFolder (a hidden folder only this app can see).
             * @param {string} accessToken
             * @param {Object} vaultData
             * @returns {Promise<Object>}
             */
            async saveToGoogleDrive(accessToken, vaultData) {
                const fileId = await this.findDriveBackupFileId(accessToken);
                const metadata = fileId
                    ? { name: DRIVE_BACKUP_FILENAME }
                    : { name: DRIVE_BACKUP_FILENAME, mimeType: 'application/json', parents: ['appDataFolder'] };

                const boundary = 'securevault-' + Date.now();
                const body =
                    `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(metadata)}\r\n` +
                    `--${boundary}\r\nContent-Type: application/json\r\n\r\n${JSON.stringify(vaultData)}\r\n` +
                    `--${boundary}--`;

                const url = fileId
                    ? `https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=multipart`
                    : 'https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart';

                const res = await fetch(url, {
                    method: fileId ? 'PATCH' : 'POST',
                    headers: {
                        Authorization: `Bearer ${accessToken}`,
                        'Content-Type': `multipart/related; boundary=${boundary}`
                    },
                    body
                });
                if (!res.ok) {
                    throw new Error('Google Drive upload failed (' + res.status + ')');
                }
                return await res.json();
            }

            /**
             * Download and parse the backup file from Drive's appDataFolder.
             * @param {string} accessToken
             * @returns {Promise<Object|null>} the parsed vault data, or null if no backup exists yet
             */
            async restoreFromGoogleDrive(accessToken) {
                const fileId = await this.findDriveBackupFileId(accessToken);
                if (!fileId) {
                    return null;
                }
                const res = await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`, {
                    headers: { Authorization: `Bearer ${accessToken}` }
                });
                if (!res.ok) {
                    throw new Error('Google Drive download failed (' + res.status + ')');
                }
                return await res.json();
            }

            /**
             * Push the current (already-encrypted) vault entries and this
             * device's salt up to Google Drive. Requires the vault to be
             * unlocked, since the salt only means something alongside a
             * password the user has actually entered.
             * @returns {Promise<void>}
             */
            async syncToCloud() {
                if (!this.currentUser || this.currentUser.loginMethod !== 'google') {
                    this.showAlert('Sign in with Google to enable cloud sync', 'warning');
                    return;
                }
                if (this.isLocked || !this.key || !this.salt) {
                    this.showAlert('Unlock the app before syncing to Google Drive', 'warning');
                    return;
                }

                try {
                    const entries = await this.getVaultEntries();
                    const vaultData = {
                        version: '1.0',
                        timestamp: new Date().toISOString(),
                        entries: entries,
                        salt: CryptoUtils.arrayToBase64(this.salt),
                        user: this.currentUser
                    };

                    // Keep a local copy too, as a fallback if Drive is unreachable.
                    await this.saveToLocalStorage('vaultBackup', vaultData);

                    const accessToken = await this.getGoogleAccessToken();
                    await this.saveToGoogleDrive(accessToken, vaultData);

                    this.showAlert('Vault synced to Google Drive', 'success');
                } catch (error) {
                    console.error('Sync failed:', error);
                    this.showAlert('Cloud sync failed: ' + error.message, 'danger');
                }
            }

            /**
             * Pull the encrypted vault + salt down from Google Drive and
             * write them into this device's local database. Entries stay
             * encrypted the whole time - Drive only ever sees ciphertext.
             * @param {{ silent?: boolean }} [options] pass { silent: true } to suppress user-facing alerts (used right after sign-in, when "no backup yet" is expected)
             * @returns {Promise<boolean>} true if a backup was found and restored
             */
            async restoreFromCloud(options) {
                const silent = !!(options && options.silent);
                try {
                    const accessToken = await this.getGoogleAccessToken();
                    const vaultData = await this.restoreFromGoogleDrive(accessToken);

                    if (!vaultData || !Array.isArray(vaultData.entries)) {
                        if (!silent) this.showAlert('No Google Drive backup found yet', 'warning');
                        return false;
                    }

                    if (vaultData.salt) {
                        await this.saveToLocalStorage('applock', { salt: vaultData.salt });
                    }

                    await new Promise((resolve, reject) => {
                        const tx = this.db.transaction('vault', 'readwrite');
                        const store = tx.objectStore('vault');
                        vaultData.entries.forEach(entry => store.put(entry));
                        tx.oncomplete = resolve;
                        tx.onerror = () => reject(tx.error);
                    });

                    if (!silent) this.showAlert('Vault restored from Google Drive', 'success');
                    if (!this.isLocked && this.key) {
                        this.loadPasswords();
                    }
                    return true;
                } catch (error) {
                    console.error('Restore failed:', error);
                    if (!silent) this.showAlert('Cloud restore failed: ' + error.message, 'danger');
                    return false;
                }
            }

            // ========== EXPORT ==========
            exportVault() {
                this.getVaultEntries().then(async entries => {
                    const decrypted = [];
                    for (const entry of entries) {
                        try {
                            const data = await CryptoUtils.decrypt(entry.encrypted, this.key);
                            decrypted.push(data);
                        } catch (error) {
                            console.error('Failed to decrypt entry:', error);
                        }
                    }

                    const csv = this.convertToCSV(decrypted);
                    const blob = new Blob([csv], { type: 'text/csv' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `securevault-export-${new Date().toISOString().split('T')[0]}.csv`;
                    a.click();
                    URL.revokeObjectURL(url);

                    this.showAlert('Vault exported successfully. Keep this file secure!', 'success');
                });
            }

            /**
             * @param {Array<Object>} entries
             * @returns {string}
             */
            convertToCSV(entries) {
                const headers = ['Title', 'Category', 'Website', 'Username', 'Password', 'Notes'];
                const rows = entries.map(entry => [
                    entry.title,
                    entry.category,
                    entry.website,
                    entry.username,
                    entry.password,
                    entry.notes
                ]);

                const csv = [headers, ...rows]
                    .map(row => row.map(cell => `"${String(cell).replace(/"/g, '""')}"`).join(','))
                    .join('\n');

                return csv;
            }

            // ========== UI HELPERS ==========
            showAddModal() {
                if (this.isLocked) {
                    this.showAlert('Vault is locked', 'warning');
                    return;
                }

                this.editingId = null;
                document.getElementById('formTitle').value = '';
                document.getElementById('formCategory').value = 'Personal';
                document.getElementById('formWebsite').value = '';
                document.getElementById('formUsername').value = '';
                document.getElementById('formPassword').value = '';
                document.getElementById('formNotes').value = '';
                this.openModal('addModal');
            }

            showSettings() {
                this.openModal('settingsModal');
            }

            /**
             * @param {string} id
             */
            openModal(id) {
                document.getElementById(id).classList.add('active');
                this.resetAutoLock();
            }

            /**
             * @param {string} id
             */
            closeModal(id) {
                document.getElementById(id).classList.remove('active');
                this.resetAutoLock();
            }

            togglePasswordVisibility() {
                const input = document.getElementById('formPassword');
                input.type = input.type === 'password' ? 'text' : 'password';
            }

            toggleEditPasswordVisibility() {
                const input = document.getElementById('editPassword');
                input.type = input.type === 'password' ? 'text' : 'password';
            }

            /**
             * @param {string} message
             * @param {'info'|'success'|'warning'|'danger'} [type='info']
             */
            showAlert(message, type = 'info') {
                const container = document.getElementById('alertContainer');
                const alert = document.createElement('div');
                alert.className = `alert alert-${type}`;
                alert.innerHTML = `
                    <span>${message}</span>
                    <button class="alert-close" onclick="this.parentElement.remove()">✕</button>
                `;
                container.appendChild(alert);
                setTimeout(() => alert.remove(), 5000);
            }

            showAuthScreen() {
                document.getElementById('authScreen').style.display = 'flex';
                document.getElementById('appScreen').style.display = 'none';
            }

            /**
             * Switch which step of the auth screen is visible.
             * @param {'google'|'setup'|'unlock'} step
             * @param {string} [message] optional message shown in the subtitle (e.g. why the app locked)
             */
            showAuthStep(step, message) {
                const steps = { google: 'googleSignInStep', setup: 'appLockSetupStep', unlock: 'appLockUnlockStep' };
                Object. values(steps).forEach(id =\> { const element = document.getElement Byld(id); if (element) { element.style.display = 'none'; }
                document.getElementById(steps[step]).style.display = 'flex';

                const subtitles = {
                    google: 'Sign in with Google to access your encrypted vault',
                    setup: 'Create an app lock password to protect this device',
                    unlock: 'Enter your app lock password to continue'
                };
                document.getElementById('authSubtitle').textContent = message || subtitles[step];
            }

            showAppScreen() {
                document.getElementById('authScreen').style.display = 'none';
                document.getElementById('appScreen').style.display = 'flex';
                document.getElementById('vaultStatus').style.color = 'var(--success)';
                document.getElementById('vaultStatusText').textContent = 'Unlocked';

                if (this.currentUser) {
                    const initials = this.currentUser.name.split(' ').map(n => n[0]).join('').toUpperCase();
                    document.getElementById('userAvatar').textContent = initials;
                    document.getElementById('userName').textContent = this.currentUser.name;
                    
                    if (this.currentUser.picture) {
                        document.getElementById('userAvatar').style.backgroundImage = `url(${this.currentUser.picture})`;
                        document.getElementById('userAvatar').style.backgroundSize = 'cover';
                        document.getElementById('userAvatar').textContent = '';
                    }
                }

                this.loadPasswords();
                this.resetAutoLock();
            }

            /**
             * @param {string} text
             * @returns {string}
             */
            escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            /**
             * @param {string} key
             * @param {*} data
             * @returns {Promise<void>}
             */
            async saveToLocalStorage(key, data) {
                return new Promise((resolve) => {
                    try {
                        const tx = this.db.transaction('settings', 'readwrite');
                        const store = tx.objectStore('settings');
                        store.put({ key: key, value: data });
                        tx.oncomplete = () => resolve(true);
                        tx.onerror = () => {
                            console.error('Failed to save to local storage:', tx.error);
                            resolve(false);
                        };
                    } catch (error) {
                        console.error('Failed to save to local storage:', error);
                        resolve(false);
                    }
                });
            }

            clearAllData() {
                if (confirm('⚠️  This will permanently delete ALL your passwords. This cannot be undone. Are you absolutely sure?')) {
                    const tx = this.db.transaction('vault', 'readwrite');
                    tx.objectStore('vault').clear();
                    tx.oncomplete = () => {
                        this.showAlert('All data cleared', 'success');
                        this.loadPasswords();
                    };
                }
            }
        }

        // ========== INITIALIZE APP ==========
        const app = new SecureVault();

        // Close modals on overlay click
        document.querySelectorAll('.modal-overlay').forEach(overlay => {
            overlay.addEventListener('click', (e) => {
                if (e.target === overlay) {
                    overlay.classList.remove('active');
                }
            });
        });

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                document.querySelectorAll('.modal-overlay').forEach(m => m.classList.remove('active'));
            }
            if ((e.ctrlKey || e.metaKey) && e.key === 'n') {
                e.preventDefault();
                app.showAddModal();
            }
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecureVault - Password Manager</title>
    <script src="https://accounts.google.com/gsi/client"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #7c3aed;
            --primary-light: #a78bfa;
            --secondary: #ec4899;
            --dark-bg: #0f172a;
            --card-bg: #1e293b;
            --border-color: #334155;
            --text-primary: #f1f5f9;
            --text-secondary: #cbd5e1;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --glass-bg: rgba(30, 41, 59, 0.7);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, var(--dark-bg) 0%, #1a1f3a 100%);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ========== ANIMATIONS ========== */
        @keyframes slideInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.5;
            }
        }

        @keyframes spin {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(360deg);
            }
        }

        @keyframes glow {
            0%, 100% {
                box-shadow: 0 0 20px rgba(124, 58, 237, 0.4), inset 0 0 20px rgba(124, 58, 237, 0.1);
            }
            50% {
                box-shadow: 0 0 30px rgba(124, 58, 237, 0.6), inset 0 0 30px rgba(124, 58, 237, 0.2);
            }
        }

        /* ========== LAYOUT ========== */
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
            width: 100%;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        header {
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(124, 58, 237, 0.2);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            animation: slideInUp 0.6s ease-out;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .logo {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header-right {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 15px;
            background: rgba(124, 58, 237, 0.1);
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .user-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 14px;
        }

        /* ========== BUTTONS ========== */
        button {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(124, 58, 237, 0.4);
        }

        button:active:not(:disabled) {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
        }

        .btn-secondary:hover {
            background: rgba(124, 58, 237, 0.2);
            border-color: var(--primary);
        }

        .btn-danger {
            background: linear-gradient(135deg, var(--danger) 0%, #dc2626 100%);
        }

        .btn-small {
            padding: 6px 12px;
            font-size: 12px;
        }

        .btn-icon {
            width: 40px;
            height: 40px;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
        }

        /* ========== MAIN CONTENT ========== */
        .main {
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 20px;
            flex: 1;
        }

        /* ========== SIDEBAR ========== */
        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .sidebar-section {
            background: var(--glass-bg);
            border: 1px solid rgba(124, 58, 237, 0.2);
            border-radius: 12px;
            padding: 20px;
            animation: slideInUp 0.6s ease-out;
        }

        .sidebar-section h3 {
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--primary-light);
            margin-bottom: 15px;
        }

        .filter-btn {
            width: 100%;
            justify-content: flex-start;
            padding: 10px 15px;
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            margin-bottom: 8px;
            text-align: left;
            font-weight: 500;
        }

        .filter-btn.active {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-color: var(--primary);
            color: white;
        }

        .security-score {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid var(--success);
            border-radius: 8px;
            padding: 15px;
            text-align: center;
        }

        .score-value {
            font-size: 32px;
            font-weight: 700;
            color: var(--success);
            margin-bottom: 5px;
        }

        .score-label {
            font-size: 12px;
            color: var(--text-secondary);
        }

        /* ========== CONTENT AREA ========== */
        .content {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .search-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }

        .search-input {
            flex: 1;
            background: var(--glass-bg);
            border: 1px solid rgba(124, 58, 237, 0.2);
            border-radius: 8px;
            padding: 12px 16px;
            color: var(--text-primary);
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .search-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.1);
        }

        .search-input::placeholder {
            color: var(--text-secondary);
        }

        /* ========== PASSWORD CARDS ========== */
        .cards-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
            animation: fadeIn 0.6s ease-out;
        }

        .password-card {
            background: var(--glass-bg);
            border: 1px solid rgba(124, 58, 237, 0.2);
            border-radius: 12px;
            padding: 20px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .password-card:hover {
            border-color: var(--primary);
            transform: translateY(-4px);
            box-shadow: 0 12px 24px rgba(124, 58, 237, 0.2);
        }

        .password-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
            transition: left 0.5s ease;
        }

        .password-card:hover::before {
            left: 100%;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 15px;
        }

        .card-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .card-category {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--primary-light);
            background: rgba(124, 58, 237, 0.2);
            padding: 4px 8px;
            border-radius: 4px;
            display: inline-block;
        }

        .card-actions {
            display: flex;
            gap: 8px;
        }

        .card-field {
            margin-bottom: 12px;
        }

        .card-field-label {
            font-size: 11px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
            display: block;
        }

        .card-field-value {
            font-size: 14px;
            word-break: break-all;
            font-family: 'Courier New', monospace;
            padding: 8px 12px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .copy-btn {
            padding: 0;
            width: 30px;
            height: 30px;
            font-size: 12px;
            border-radius: 4px;
        }

        .strength-indicator {
            height: 4px;
            border-radius: 2px;
            margin-top: 8px;
            background: var(--danger);
        }

        .strength-weak {
            background: var(--danger);
        }

        .strength-fair {
            background: var(--warning);
        }

        .strength-good {
            background: #3b82f6;
        }

        .strength-strong {
            background: var(--success);
        }

        /* ========== MODALS ========== */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(4px);
            z-index: 1000;
            animation: fadeIn 0.3s ease;
        }

        .modal-overlay.active {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .modal {
            background: var(--dark-bg);
            border: 1px solid rgba(124, 58, 237, 0.2);
            border-radius: 16px;
            padding: 30px;
            max-width: 500px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            animation: slideInUp 0.3s ease;
            position: relative;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-title {
            font-size: 22px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .close-btn {
            width: 36px;
            height: 36px;
            padding: 0;
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
        }

        .close-btn:hover {
            background: rgba(124, 58, 237, 0.2);
            border-color: var(--primary);
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-secondary);
        }

        input, textarea, select {
            width: 100%;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
            color: var(--text-primary);
            font-size: 14px;
            transition: all 0.3s ease;
        }

        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.1);
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        .password-generator-section {
            background: rgba(124, 58, 237, 0.1);
            border: 1px solid rgba(124, 58, 237, 0.2);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
        }

        .generator-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }

        .generator-option {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .generator-option input[type="checkbox"] {
            width: auto;
        }

        .length-slider {
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: var(--border-color);
            outline: none;
            -webkit-appearance: none;
        }

        .length-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            cursor: pointer;
            box-shadow: 0 0 10px rgba(124, 58, 237, 0.4);
        }

        .length-slider::-moz-range-thumb {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            cursor: pointer;
            box-shadow: 0 0 10px rgba(124, 58, 237, 0.4);
            border: none;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 30px;
        }

        /* ========== AUTH SCREEN ========== */
        .auth-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .auth-card {
            background: var(--glass-bg);
            border: 1px solid rgba(124, 58, 237, 0.2);
            border-radius: 16px;
            padding: 40px;
            max-width: 400px;
            width: 100%;
            animation: slideInUp 0.6s ease-out;
        }

        .auth-logo {
            font-size: 48px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-align: center;
            margin-bottom: 20px;
        }

        .auth-title {
            font-size: 24px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 10px;
        }

        .auth-subtitle {
            font-size: 14px;
            color: var(--text-secondary);
            text-align: center;
            margin-bottom: 30px;
        }

        .auth-form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* ========== LOADING & ALERTS ========== */
        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(124, 58, 237, 0.2);
            border-top: 3px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        .alert {
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 13px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            animation: slideInUp 0.3s ease;
            margin-bottom: 15px;
        }

        .alert-success {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid var(--success);
            color: var(--success);
        }

        .alert-warning {
            background: rgba(245, 158, 11, 0.1);
            border: 1px solid var(--warning);
            color: var(--warning);
        }

        .alert-danger {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid var(--danger);
            color: var(--danger);
        }

        .alert-close {
            background: transparent;
            border: none;
            color: inherit;
            cursor: pointer;
            font-size: 16px;
            padding: 0;
            width: auto;
        }

        /* ========== EMPTY STATE ========== */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }

        .empty-icon {
            font-size: 64px;
            margin-bottom: 20px;
        }

        /* ========== RESPONSIVE ========== */
        @media (max-width: 968px) {
            .main {
                grid-template-columns: 1fr;
            }

            .sidebar {
                display: grid;
                grid-template-columns: repeat(2, 1fr);
                gap: 15px;
            }

            .cards-container {
                grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            }
        }

        @media (max-width: 640px) {
            header {
                flex-direction: column;
                gap: 15px;
            }

            .header-left {
                flex-direction: column;
                align-items: flex-start;
            }

            .header-right {
                width: 100%;
                justify-content: flex-start;
            }

            .logo {
                font-size: 24px;
            }

            .sidebar {
                display: flex;
                flex-direction: column;
            }

            .cards-container {
                grid-template-columns: 1fr;
            }

            .generator-options {
                grid-template-columns: 1fr;
            }

            .auth-card {
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body>
    <!-- Auth Screen -->
    <div id="authScreen" class="auth-container" style="display: none;">
        <div class="auth-card">
            <div class="auth-logo">🔐</div>
            <h1 class="auth-title">SecureVault</h1>
            <p class="auth-subtitle" id="authSubtitle">Your encrypted password manager</p>

            <!-- Step 1: Google Sign-In (the only account/login method) -->
            <div id="googleSignInStep" class="auth-form">
                <div id="googleSignInContainer"></div>
            </div>

            <!-- Step 2: first-time app lock password setup (shown once, right after Google sign-in) -->
            <div id="appLockSetupStep" class="auth-form" style="display: none;">
                <input type="password" id="appLockPassword" placeholder="Create App Lock Password" style="margin-bottom: 10px;">
                <input type="password" id="appLockPasswordConfirm" placeholder="Confirm App Lock Password">
                <button onclick="app.setupAppLockPassword()" style="margin-top: 20px;">Set App Lock Password</button>
            </div>

            <!-- Step 3: returning session / manually locked - unlock with the app lock password -->
            <div id="appLockUnlockStep" class="auth-form" style="display: none;">
                <input type="password" id="appUnlockPassword" placeholder="Enter App Lock Password" onkeydown="if (event.key === 'Enter') app.unlockWithPasswordInput()">
                <button onclick="app.unlockWithPasswordInput()" style="margin-top: 20px;">Unlock</button>
            </div>
        </div>
    </div>

    <!-- Main App -->
    <div id="appScreen" style="display: none; flex: 1; display: flex; flex-direction: column;">
        <div class="container">
            <!-- Header -->
            <header>
                <div class="header-left">
                    <div class="logo">🔐 SecureVault</div>
                    <div style="display: flex; gap: 5px; align-items: center;">
                        <span id="vaultStatus" style="font-size: 12px; color: var(--text-secondary);">●</span>
                        <span id="vaultStatusText" style="font-size: 13px;">Unlocked</span>
                    </div>
                </div>
                <div class="header-right">
                    <div class="user-info">
                        <div class="user-avatar" id="userAvatar">U</div>
                        <div style="font-size: 13px;">
                            <div id="userName" style="font-weight: 600;">User</div>
                            <div style="color: var(--text-secondary); font-size: 11px;">Synced</div>
                        </div>
                    </div>
                    <button class="btn-secondary btn-icon" onclick="app.toggleLock()" title="Lock App">🔒</button>
                    <button class="btn-secondary btn-icon" onclick="app.showSettings()" title="Settings">⚙️</button>
                    <button class="btn-danger btn-icon" onclick="app.logout()" title="Logout">🚪</button>
                </div>
            </header>

            <!-- Main Content -->
            <div class="main">
                <!-- Sidebar -->
                <div class="sidebar">
                    <!-- Categories -->
                    <div class="sidebar-section">
                        <h3>Categories</h3>
                        <button class="filter-btn active" onclick="app.filterByCategory('all')">📁 All Passwords</button>
                        <button class="filter-btn" onclick="app.filterByCategory('Work')">💼 Work</button>
                        <button class="filter-btn" onclick="app.filterByCategory('Personal')">👤 Personal</button>
                        <button class="filter-btn" onclick="app.filterByCategory('Finance')">💳 Finance</button>
                        <button class="filter-btn" onclick="app.filterByCategory('Social')">📱 Social</button>
                        <button class="filter-btn" onclick="app.filterByCategory('Other')">📌 Other</button>
                    </div>

                    <!-- Security Score -->
                    <div class="sidebar-section">
                        <h3>Security Score</h3>
                        <div class="security-score">
                            <div class="score-value" id="securityScore">0%</div>
                            <div class="score-label" id="securityLabel">No passwords yet</div>
                        </div>
                        <button style="width: 100%; margin-top: 15px;" onclick="app.showSecurityAudit()">
                            Run Security Audit
                        </button>
                    </div>

                    <!-- Quick Actions -->
                    <div class="sidebar-section">
                        <h3>Quick Actions</h3>
                        <button style="width: 100%; margin-bottom: 8px;" onclick="app.showAddModal()">
                            ➕ Add Password
                        </button>
                        <button class="btn-secondary" style="width: 100%;" onclick="app.exportVault()">
                            📥 Export Vault
                        </button>
                    </div>
                </div>

                <!-- Content -->
                <div class="content">
                    <div class="search-bar">
                        <input type="text" class="search-input" id="searchInput" placeholder="Search passwords..." onkeyup="app.search()">
                        <button class="btn-secondary btn-icon" onclick="app.search()" title="Search">🔍</button>
                    </div>

                    <div id="alertContainer"></div>
                    <div class="cards-container" id="cardsContainer"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modals -->
    <div id="addModal" class="modal-overlay">
        <div class="modal">
            <div class="modal-header">
                <h2 class="modal-title">Add New Password</h2>
                <button class="close-btn" onclick="app.closeModal('addModal')">✕</button>
            </div>
            
            <div class="form-group">
                <label>Title</label>
                <input type="text" id="formTitle" placeholder="e.g., Gmail, Netflix, etc.">
            </div>

            <div class="form-group">
                <label>Category</label>
                <select id="formCategory">
                    <option value="Personal">Personal</option>
                    <option value="Work">Work</option>
                    <option value="Finance">Finance</option>
                    <option value="Social">Social</option>
                    <option value="Other">Other</option>
                </select>
            </div>

            <div class="form-group">
                <label>Website/URL</label>
                <input type="url" id="formWebsite" placeholder="https://example.com">
            </div>

            <div class="form-group">
                <label>Email/Username</label>
                <input type="text" id="formUsername" placeholder="your.email@example.com">
            </div>

            <div class="form-group">
                <label>Password</label>
